services:
  scrollmeter:
    build:
      context: .
      dockerfile: Dockerfile
    image: scrollmeter:latest
    container_name: scrollmeter-app
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      - NODE_ENV=production

